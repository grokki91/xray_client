# Совместимость ядер клиентов с правилом X25519MLKEM768 сервера (REALITY ≥ v26.9.9).
# Источник — grokki91/xray, .claude/skills/xray-dpi/references/landscape.md (проверено 2026-11-06).
# Правка факта — в обоих местах, с датой (AGENTS.md: «инструкции меняются вместе с кодом»).
# Когда сервер доступен через мост, клиент доверяет серверу (S1.mlkem_rule), а не этой таблице.

updated: "2026-11-06"
source: "landscape.md#Клиенты"

server:
  # С этой версии REALITY отдаёт сайту-маске ClientHello без X25519MLKEM768 перед X25519.
  mlkem_rule_from: "26.9.9"

# Отпечатки uTLS в ядре Xray: с какой версии ядра пресет шлёт X25519MLKEM768.
# null — пресет его не шлёт ни в какой версии (или не браузерный).
xray_fingerprints:
  chrome:  {mlkem_from: "25.7.26"}
  firefox: {mlkem_from: "26.3.27"}
  safari:  {mlkem_from: "26.3.27"}
  edge:    {mlkem_from: null}
  ios:     {mlkem_from: null}
  android: {mlkem_from: null}
  "360":   {mlkem_from: null}
  qq:      {mlkem_from: null}
  random:           {mlkem_from: null, random: true}
  randomized:       {mlkem_from: null, random: true}
  randomizednoalpn: {mlkem_from: null, random: true}

# Ядра Xray с открытой XTLS/Xray-core#6797 (сборки Go 1.27): при зависших хендшейках плодят
# соединения. Рабочий откат — v26.7.28.
xray_bug6797_from: "26.9.8"

clients:
  hiddify:
    # Все релизы 4.x: ядро hiddify-sing-box (форк sing-box 1.13) вырезает X25519MLKEM768
    # (common/tls/reality_client.go). Исправлено в 5.x: первый тег — v5.2.0 (2026-10-30).
    - versions: "<5.0.0"
      core: "hiddify-sing-box"
      core_family: "sing-box"
      mlkem: false
      note: "Hiddify 4.x: ядро sing-box вырезает X25519MLKEM768 из ClientHello REALITY"
    # 5.x (v5.2.0, v5.5.5): common/tls/h_reality_hello.go ставит X25519MLKEM768 перед X25519 в
    # supported_groups и key_share при любом fp (key_share "hybrid" по умолчанию; "classical" —
    # без неё, в окне приложения опции нет). По исходнику; на машине не проверено.
    - versions: ">=5.0.0"
      core: "hiddify-sing-box v5"
      core_family: "sing-box"
      mlkem: true
      note: "Hiddify 5.x: ядро шлёт X25519MLKEM768 перед X25519 при любом fp (по исходнику)"
  v2rayn:
    # Ядро определяет профиль (CoreType) или таблица CoreTypeItem; по умолчанию Xray.
    cores:
      Xray:     {family: "xray"}
      sing_box: {family: "sing-box", mlkem: false, note: "sing-box (в т. ч. v1.14.4) вырезает X25519MLKEM768 — SagerNet/sing-box#4520"}
      mihomo:   {family: "mihomo", mlkem: false, note: "mihomo шлёт X25519MLKEM768 только с опцией support-x25519mlkem768"}

# Рекомендуемые клиенты (текст действия): ядро Xray, свежая версия.
recommend: "v2rayN с ядром Xray от v25.7.26 и fp=chrome (firefox — ядро от v26.3.27)"
