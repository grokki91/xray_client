# Гипотезы: интернет, профиль, сервер. Синтаксис предикатов — internal/evidence (Eval).
# Уровни: confirmed — наблюдение с двух сторон или воспроизведение; likely — наблюдение с одной
# стороны и эталон снял альтернативы; possible — косвенно (таблица версий, лог, слова);
# excluded — есть противоречащая улика. Внутри группы — «и», между группами — «или».

# Пробы шли мимо тоннеля (N1.bound), а маршрут по умолчанию держит другой VPN: «нет интернета»
# мимо него ещё не значит «нет интернета» — его kill switch не пускает трафик мимо себя, и тогда
# всё (российские сайты, VPN-клиент) идёт только через него. Различает повтор с ним выключенным.
- code: os.vpn.other
  likely:
    - ["N1.ok=false", "N1.bound=true", "W2.iface_kind=vpn"]
    - ["N1.ok=false", "N1.bound=true", "W1.other_vpn", "W1.default_via_tun=true", "!W1.tun_adapters"]
  excluded: ["N1.ok=true"]
  title: "Весь трафик ПК идёт через другой VPN ({W1.other_vpn}), а мимо него сайты не открываются"
  why: "Маршрут по умолчанию — у {W1.other_vpn}, пробы xdiag мимо него не открыли ни одного сайта. Если этот VPN не пускает трафик мимо себя (kill switch), через него идёт всё — и российские сайты, и VPN-клиент: перестал отвечать он — пропадает весь интернет."
  alternative: "То же даёт настоящее отсутствие интернета (кабель, Wi-Fi, роутер). Различит повтор с выключенным {W1.other_vpn}: сайты открылись — дело в нём."
  actions:
    - "Выключить {W1.other_vpn} (или его kill switch — «блокировать трафик вне туннеля») и снова нажать «Диагностировать»"
    - "Без него сайты открываются — сбой в нём (его сервер недоступен из этой сети): два VPN сразу не держать"
    - "Без него тоже не открываются — проверить кабель или Wi-Fi, перезагрузить роутер"

# «Подтверждено» — только если пробы шли по маршруту Windows: мимо тоннеля их может закрыть сам
# тоннель (kill switch другого VPN; strict_route sing-box закрывает порт 53 всем, кроме ядра).
- code: lan.noinet
  confirmed:
    - ["N1.ok=false", "N4.ok=false", "!N1.bound=true"]
  likely:
    - ["N1.ok=false"]
  excluded: ["N1.ok=true"]
  title: "Интернета нет: не открылся ни один эталонный сайт"
  why: "Ни проверка интернета Windows, ни generate_204, ни российский эталон не ответили. До VPN-сервера дело не доходит."
  alternative: "Если сайты в браузере при этом открываются — их открывает VPN-клиент в режиме TUN, а прямой путь закрыт: тогда это сбой сети или настроек TUN клиента."
  actions:
    - "Проверить кабель или Wi-Fi, перезагрузить роутер"
    - "Выключить VPN-клиент и проверить, открываются ли сайты без него"
    - "В публичной сети (кафе, отель) — открыть любой сайт в браузере: может требоваться вход на портал"

- code: profile.missing
  likely:
    - ["C3.found=false"]
  excluded: ["C3.found=true"]
  title: "Профиль сервера не найден: проверять нечего"
  why: "Ни в Hiddify, ни в v2rayN не нашлось профиля VLESS+REALITY, и он не задан в настройках приложения."
  actions:
    - "Вставить профиль (vless://…) в «Настройки → Профиль»: он хранится только на этом ПК, зашифрованным"
    - "Если v2rayN портативный — указать его папку в «Настройки → Папка v2rayN»"
    - "Профиль с сервера: `sudo xm uri <имя>`"

# Профиль цел, но не VLESS + REALITY (VLESS + TLS, VMess, …): xdiag его не диагностирует.
# Это не «испорчен при импорте» (profile.import) — переимпорт ничего не изменит.
- code: profile.unsupported
  likely:
    - ["C3.issues~security.not_reality|protocol.not_vless"]
  title: "Профиль не поддерживается: {C3.kind} — xdiag проверяет только VLESS + REALITY"
  why: "Выбранный профиль — {C3.kind}. Он может быть исправен, но xdiag диагностирует только подключения VLESS + REALITY (установка `grokki91/xray`): эталонное ядро, сверка с сервером и правила рассчитаны на REALITY. Проверки сервера и пути для этого профиля ничего не доказывают."
  actions:
    - "Вставить профиль VLESS + REALITY (vless://…?security=reality…) в «Настройки → Профиль»"
    - "Профиль с сервера: `sudo xm uri <имя>`"
    - "Если нужен именно этот профиль — проверять его средствами клиента: xdiag его не диагностирует"

- code: server.listen
  confirmed:
    - ["S1.self_r=fail", "S1.self_at=listen"]
    - ["S3.code=server.listen"]
  likely:
    - ["P1.outcome=refused", "N1.ok=true"]
  excluded: ["P2.outcome=mask_cert", "P3.outcome=ok|real_cert", "C10.outcome=ok"]
  title: "Сервер: Xray не слушает публичный порт"
  why: "На порт сервера приходит отказ (RST): соединение доходит, но принимать его некому."
  alternative: "RST вместо сервера может прислать файрвол роутера или провайдера; подтвердит самопроверка сервера (мост) или `sudo xm doctor`."
  actions:
    - "`sudo systemctl status xray --no-pager`"
    - "`sudo journalctl -u xray -n 30 --no-pager`"
    - "`sudo xm restart`"
  next_checks: [S1]

- code: server.dns
  confirmed:
    - ["S1.self_r=fail", "S1.self_at=dns"]
    - ["S3.code=server.dns"]
  title: "Сервер: домен-маска не резолвится — REALITY некуда отдать соединение"
  why: "Самопроверка сервера: имя из serverNames не резолвится с сервера."
  actions: ["`sudo xm watchdog now`", "`sudo xm diag-dpi`"]

- code: server.egress
  confirmed:
    - ["S1.self_r=fail", "S1.self_at=egress"]
    - ["S3.code=server.egress"]
  title: "Сервер: нет выхода в интернет"
  why: "Самопроверка сервера: запрос наружу не прошёл ни через тоннель, ни напрямую."
  actions: ["`curl -sI --max-time 5 https://www.google.com/generate_204` на сервере", "Вопрос хостеру"]

- code: server.handshake
  confirmed:
    - ["S1.self_r=fail", "S1.self_at=handshake"]
    - ["S3.code=server.handshake"]
  title: "Сервер: собственный клиент на петле не проходит рукопожатие"
  why: "Самопроверка сервера: VLESS+REALITY с самого сервера не прошёл."
  actions: ["`sudo xray -test -config /usr/local/etc/xray/config.json`", "`sudo xm selftest`"]

- code: server.firewall
  confirmed:
    - ["S1.ufw=closed"]
    - ["S3.code=server.firewall"]
  title: "Сервер: публичный порт закрыт в UFW"
  why: "UFW на сервере активен, правила ALLOW для публичного порта нет — SYN отбрасывается."
  actions: ["`sudo ufw allow 443/tcp` (порт — публичный порт установки)"]

- code: server.syn
  confirmed:
    - ["S3.code=server.syn"]
  title: "Сервер: SYN доходит, но сервер не отвечает"
  why: "Окно `xm doctor`: попытка из сети этого ПК пришла, SYN-ACK не ушёл."
  actions: ["`sudo ufw status verbose`", "`sudo ss -tlnp`"]

# Порт сервера молчит (SYN без ответа и через 30 с), а SSH того же адреса отвечает (P6 или мост):
# адрес не заблокирован целиком. Чаще причина на сервере — её проверить быстрее, SSH есть.
- code: server.port.drop
  gate: ["N1.ok=true"]
  confirmed:
    - ["P1.outcome=timeout", "P6.reach=true", "P5.p1=timeout|unreachable"]
    - ["P1.outcome=timeout", "S0.ssh=ok", "P5.p1=timeout|unreachable"]
    - ["P1.outcome=timeout", "P5.p1=timeout|unreachable", "P5.p6=reach"]
  likely:
    - ["P1.outcome=timeout", "P4.tcp=timeout", "P6.reach=true"]
    - ["P1.outcome=timeout", "P4.tcp=timeout", "S0.ssh=ok"]
  possible:
    - ["P1.outcome=timeout", "P6.reach=true"]
    - ["P1.outcome=timeout", "S0.ssh=ok"]
  excluded: ["P1.outcome=ok", "C10.outcome=ok", "P5.p1=ok", "S3.code=net.nosyn"]
  title: "Порт сервера молчит, а SSH того же адреса отвечает"
  why: "Адрес не заблокирован: SSH открыт, а SYN к порту сервера остаётся без ответа. Так бывает, когда порт закрыт файрволом сервера или хостера, Xray слушает другой порт или в профиле старый порт."
  alternative: "То же даёт фильтр провайдера по порту. Различить — окном сервера (доходят ли SYN) или из другой сети."
  actions:
    - "На сервере: `sudo ss -tlnp | grep xray` — слушает ли Xray порт профиля"
    - "`sudo ufw status` и файрвол в панели хостера — открыт ли этот порт"
    - "Порт в профиле сверить с сервером: `sudo xm uri <имя>`"
    - "На сервере всё открыто — режет сеть: проверить из другой сети"
  next_checks: [S3, P5]

# Порт сервера молчит из двух разных сетей (P5 — сеанс из другой сети, узнанной по шлюзу), а SSH
# того же адреса не отвечает или не проверен: провайдер этой сети ни при чём. Остаются сервер,
# хостер — и блокировка адреса по всей стране: обе сети российские, отсюда их не различить.
- code: server.unreachable
  gate: ["N1.ok=true"]
  likely:
    - ["P1.outcome=timeout|unreachable", "P6.reach=false", "P6.known=true", "P5.p1=timeout|unreachable"]
    - ["P1.outcome=timeout|unreachable", "P5.p1=timeout|unreachable"]
  excluded: ["P1.outcome=ok", "C10.outcome=ok", "P5.p1=ok|refused", "P6.reach=true", "P5.p6=reach", "S0.ssh=ok", "S3.own=true"]
  title: "Сервер не отвечает ни из этой, ни из другой сети"
  why: "TCP до порта сервера не устанавливается ни из этой сети, ни из другой. Провайдер этой сети ни при чём. Так выглядят выключенный или зависший сервер, сервер, заблокированный хостером (оплата, жалоба), закрытый файрвол сервера — или блокировка адреса по всей стране."
  alternative: "Выключенный сервер и блокировку адреса по всей России отсюда не различить: обе проверки — из российских сетей. Различит проверка из-за рубежа или веб-консоль в панели хостера."
  actions:
    - "Панель хостера: сервер включён и не заблокирован (оплата, abuse)? Открыть веб-консоль (VNC): сервер жив — там `sudo xm doctor`"
    - "Проверка из-за рубежа: check-host.net → «TCP port» → адрес:порт сервера (адрес увидит сервис проверки). Отвечает из других стран — адрес заблокирован в России: новый IP или другой хостер. Не отвечает ниоткуда — сервер или хостер: перезагрузка из панели, вопрос в поддержку"
    - "Клиентом и профилем это не лечится: не переустанавливать клиент и не жать «Подключить» многократно"
  next_checks: [S3]

# Порт сервера отвечает, а SSH-порт того же адреса (порт из алиаса или ~/.ssh/config) молчит,
# отказывает (RST) или мост не дошёл до сервера: войти на сервер по SSH из этой сети нельзя. Не причина «таймаута», но
# мост и окно сервера отсюда недоступны — вместо них проверка K1 (taxonomy.yaml: unavailable).
- code: server.ssh.silent
  kind: finding
  likely:
    - ["P1.outcome=ok", "P6.reach=false", "P6.known=true"]
    - ["P1.outcome=ok", "P6.outcome=refused", "P6.known=true"]
    - ["P1.outcome=ok", "S0.ssh=unreachable"]
  title: "SSH сервера отсюда недоступен, хотя порт VPN отвечает: войти на сервер и запустить `xm` из этой сети нельзя"
  why: "Порт сервера принимает соединения, а SSH-порт того же адреса молчит или отказывает. Так бывает, когда SSH закрыт файрволом сервера или хостера (или адрес ПК забанен защитой от перебора), когда SSH слушает другой порт или по адресу теперь другая машина — или когда сеть режет SSH."
  actions:
    - "Веб-консоль в панели хостера (VNC) или SSH из другой сети (раздача с телефона)"
    - "На сервере: `sudo ufw status` — открыт ли порт SSH"
