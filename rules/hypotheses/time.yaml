# Нестабильность во времени (docs/implementation.md, решение 15). Разовый сеанс обрывов не видит:
# их видят логи клиента за сутки (C6: серии сбоев через сервер, не меньше 5 строк без разрыва
# дольше 5 минут — одиночный таймаут обычно про сайт за тоннелем) и журнал здоровья сервера
# (S2: окна по 5 минут). Всё здесь — находки: причину «не подключается» они не называют.
# «Таймаут ≠ блокировка»: про путь — только «вероятно» с альтернативой, подтверждает S3/P5.

- code: unstable.drops
  kind: finding
  confirmed:
    - ["C6.episodes>=1", "S2.overlap>=1", "C10.outcome=ok"]
    - ["C6.episodes>=1", "S2.overlap>=1", "P3.outcome=ok"]
  likely:
    - ["C6.episodes>=2", "C10.outcome=ok"]
    - ["C6.episodes>=2", "P3.outcome=ok"]
    - ["C6.episodes>=2", "C6.recovered>=1"]
  possible:
    - ["C6.episodes>=1", "C6.recovered>=1"]
  title: "Обрывы эпизодами: в логах клиента за сутки серий сбоев через сервер — {C6.episodes}, между ними тоннель работал"
  why: "Сбои соединений через сервер (таймауты, обрывы, EOF) идут в логах клиента плотными сериями, а после них клиент работал дальше или работает сейчас. Это не постоянная поломка, а периодические обрывы; совпадение серии с инцидентом в журнале здоровья сервера подтверждает обрыв с двух сторон."
  alternative: "Такие же серии дают сон и пробуждение ПК, смена сети (Wi-Fi ↔ мобильная) и переподключение клиента вручную. Отличить — журналом здоровья сервера за те же часы."
  actions:
    - "Отметить время следующего обрыва и сразу запустить «Диагностировать» — сеанс во время обрыва покажет звено"
    - "Включить журнал здоровья на сервере (`sudo xm health on`): xdiag сверит часы обрывов с окнами сервера"
  next_checks: [S2, S3]

- code: server.episodes
  kind: finding
  likely:
    - ["C6.episodes>=1", "S2.overlap_server>=1"]
  possible:
    - ["S2.day_server>=1"]
  title: "Сервер сбоил за сутки: в журнале здоровья окон «сбой сервера» — {S2.day_server}"
  why: "Журнал здоровья отмечает окно «сервер», когда своя самопроверка сервера через публичный порт не прошла. Если такое окно совпало с серией сбоев в логах клиента — обрыв был на сервере, а не в сети."
  actions:
    - "На сервере: `sudo xm health` — полоса за 24 ч и события (перезапуск, смена конфига, версия Xray) в часы сбоев"
  next_checks: [S3]

- code: path.freeze.episodes
  kind: finding
  gate: ["N1.ok=true"]
  likely:
    - ["C6.episodes>=1", "S2.overlap_freeze>=1"]
  possible:
    - ["S2.day_freeze>=2"]
  excluded: ["S2.overlap_server>=1"]
  title: "Заморозки соединений в часы обрывов: журнал здоровья сервера видел «freeze»"
  why: "В окна журнала здоровья, совпавшие с сериями сбоев клиента, сервер видел соединения клиентов, у которых данные встают (tcp_info: после рукопожатия или на 10–32 КБ), при исправной самопроверке. Так выглядит периодическая заморозка по пути."
  alternative: "Заморозку по tcp_info дают и потери в сети провайдера или у хостера, а не только ТСПУ. Подтвердить — окном сервера во время обрыва (S3) или сравнением с другой сетью (P5)."
  actions:
    - "При следующем обрыве — окно сервера: `sudo xm doctor --live 60 --json`, в это время один раз «Подключить» в клиенте"
    - "Сравнить с другой сетью: обрывы только в одной — сменить маску (`sudo xm sni-scan`), в обеих — хостер или ASN"
  next_checks: [S3, P5]
