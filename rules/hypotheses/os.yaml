# Гипотезы: Windows (L1) и локальная сеть (L2).

- code: os.proxy.dead
  likely:
    - ["W6.system_proxy=true", "W6.proxy_local=true", "W6.proxy_listening=false"]
  title: "Windows: системный прокси указывает на локальный порт, который никто не слушает"
  why: "Клиент в режиме «системный прокси» выключился или упал, а настройка прокси осталась: браузер и приложения стучатся в пустой порт."
  actions: ["Параметры → Сеть и Интернет → Прокси-сервер → выключить «Использовать прокси-сервер»", "Или снова запустить VPN-клиент"]

- code: os.route.loop
  likely:
    - ["W2.loop=true"]
  title: "Windows: маршрут к самому серверу уходит в TUN"
  why: "Адрес сервера маршрутизируется через адаптер TUN клиента: соединение с сервером пытается пройти через тоннель к самому себе."
  actions: ["Перезапустить клиент в режиме TUN (он сам добавляет исключение для сервера)", "Отключить другие VPN-адаптеры"]

- code: os.firewall.block
  likely:
    - ["W4.block_rules>=1"]
  excluded: ["S3.own=true"]
  title: "Windows: правило файрвола блокирует VPN-клиент ({W4.block_rules})"
  why: "В брандмауэре Windows есть включённое правило «Блокировать» для программы клиента или его ядра."
  actions: ["Монитор брандмауэра Защитника Windows → Правила для исходящих/входящих → удалить блокирующие правила клиента"]

- code: os.adapter.conflict
  likely:
    - ["W1.other_vpn", "C6.tun_error>=1"]
  possible:
    - ["W1.other_vpn", "CX.tun=true"]
  title: "Windows: включён ещё один VPN-адаптер ({W1.other_vpn})"
  why: "Два TUN/VPN-адаптера одновременно спорят за маршруты и DNS."
  actions: ["Отключить другие VPN-клиенты", "Сетевые подключения → отключить лишние адаптеры (старые wintun/TAP)"]

- code: os.av.filter
  gate: ["W5.third_party=true"]
  possible:
    - ["P3.outcome=ok"]
  title: "Windows: сторонний антивирус с сетевым фильтром ({W5.av})"
  why: "Сетевые фильтры антивирусов бывают причиной обрывов у VPN-клиентов. Подтвердить можно только повтором с выключенным модулем."
  actions: ["Временно выключить сетевой экран/веб-защиту и повторить", "Добавить папку клиента в исключения"]
  next_checks: [W5]

- code: lan.dns.spoof
  kind: finding
  likely:
    - ["N3.mismatch=true"]
  title: "Провайдер подменяет ответы DNS по UDP/53"
  why: "Для заведомо блокируемого имени UDP/53 и TCP/53 (или DoH) дали разные ответы. На «таймаут» к IP-профилю не влияет, но через тоннель с маршрутом geoip:ru → direct сайт может не открываться."
  actions: ["В клиенте DNS — через тоннель или DoH", "Windows: Параметры → Сеть → DNS — зашифрованный (DoH)"]

- code: lan.ipv6.leak
  kind: finding
  possible:
    - ["W8.global_v6=true", "CX.tun=true"]
  title: "Есть глобальный IPv6: часть трафика может идти мимо тоннеля"
  why: "Сервер установки — только IPv4. Если TUN клиента не забирает IPv6, сайты по IPv6 идут напрямую или висят."
  actions: ["В клиенте включить IPv6 в TUN (или «только IPv4»)", "Или отключить IPv6 на адаптере"]

- code: lan.mtu
  possible:
    - ["W9.mtu<1400", "P2.outcome=hello_timeout|eof_after_hello|reset_after_hello"]
  title: "MTU {W9.mtu}: большой ClientHello (≈1.7 КБ с ML-KEM) может не проходить"
  why: "ClientHello с X25519MLKEM768 не помещается в один пакет; при малом MTU и сломанном PMTUD вторая часть теряется."
  actions: ["Проверить из другой сети", "На сервере: `sudo sysctl net.ipv4.tcp_mtu_probing` (нужно 1)"]
  next_checks: [P5, S3]
