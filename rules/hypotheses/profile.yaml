# Гипотезы: профиль (L5). Сверка с сервером — S1.match_* (HMAC на соли сессии, мост).

- code: profile.import
  likely:
    - ["C3.issues~addr.empty|addr.format|security.not_reality|protocol.not_vless"]
  title: "Профиль испорчен при импорте: {C3.issues_text}"
  why: "В профиле клиента не хватает обязательных полей или они испорчены (лишние пробелы, обрезанная строка)."
  actions: ["Удалить профиль и импортировать заново: `sudo xm uri <имя>` → копировать целиком"]

- code: profile.uuid
  confirmed:
    - ["S1.match_uuid=false"]
  likely:
    - ["C3.issues~uuid.empty|uuid.space|uuid.format"]
  excluded: ["S1.match_uuid=true"]
  title: "Профиль: UUID не совпадает ни с одним клиентом сервера"
  why: "UUID профиля не найден среди клиентов сервера или испорчен: REALITY пропускает соединение, а VLESS закрывает его."
  actions: ["`sudo xm clients` — есть ли клиент", "Импортировать профиль заново: `sudo xm uri <имя>`"]

