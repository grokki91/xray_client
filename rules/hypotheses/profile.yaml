# Эталон с профилем (fp chrome, X25519MLKEM768 есть) получил вместо тоннеля сертификат не того
# сайта, и обычный TLS с SNI профиля — тоже, а сам сайт-маска по своему адресу открывается: сервер
# по адресу профиля маскируется не под SNI профиля. У сервера с этим профилем TLS-зонд получил бы
# сертификат маски (profile.reality). Ядро клиента ни при чём: эталон с X25519MLKEM768 тоже не прошёл.
- code: profile.stale
  likely:
    - ["P3.outcome=real_cert", "P2.outcome=other_cert", "N4.ok=true"]
  possible:
    - ["P3.outcome=real_cert", "P2.outcome=other_cert"]
  excluded: ["P3.outcome=ok", "C10.outcome=ok", "S1.match_sni=true"]
  title: "Профиль не от сервера, который отвечает по его адресу: тот маскируется под другой сайт и профиль не узнаёт"
  why: "По адресу профиля сервер отвечает (TCP и TLS есть), но и эталонное ядро Xray с профилем (fp chrome, X25519MLKEM768 есть), и обычный TLS с SNI профиля получили сертификат другого сайта, а сам сайт-маска по своему адресу открывается. Значит, сервер по этому адресу маскируется не под сайт из профиля — его SNI, ключ и shortId другие. Ядро клиента здесь ни при чём: эталон с тем же профилем тоже не прошёл."
  alternative: "Так выглядят и сервер, переустановленный или сменивший маску (`xm set-sni`): профиль устарел, — и адрес, который хостер отдал другой машине. Реже на сервере `dest` REALITY указывает не на маску из serverNames, а профиль при этом тоже не совпадает."
  actions:
    - "Свежий профиль с сервера: `sudo xm uri <имя>` — старый в клиенте удалить, новый импортировать"
    - "SSH не пускает или сервер не тот — панель хостера: сервер включён, не переустановлен, адрес тот же? Войти через веб-консоль (VNC)"
  next_checks: [S1, S3]

- code: profile.reality
  likely:
    - ["P3.outcome=real_cert", "P2.outcome=mask_cert"]
    - ["S3.code=profile.changed"]
  possible:
    # Чужой сертификат на адресе сервера — уже profile.stale: здесь не дублировать.
    - ["P3.outcome=real_cert", "!P2.outcome=other_cert"]
  excluded: ["P3.outcome=ok", "S1.match_pbk=true", "C10.outcome=ok"]
  title: "Профиль не принят REALITY: ключ, shortId или SNI не совпадают с сервером"
  why: "Сервер жив и отдаёт сайт-маску (обычный TLS-зонд получил её сертификат), но эталонное ядро Xray с профилем пользователя (fp=chrome, X25519MLKEM768 есть) тоже получило сертификат маски вместо тоннеля. Значит, сервер не узнал профиль."
  alternative: "То же даст профиль со старым ключом после переустановки сервера и, реже, часы ПК при maxTimeDiff на сервере. Что именно не совпало — покажет сверка хэшей через мост."
  actions: ["Импортировать профиль заново: `sudo xm uri <имя>`"]
  next_checks: [S1, S3]

- code: profile.user
  likely:
    - ["P3.outcome=closed_after_handshake"]
    - ["S3.code=profile.user"]
  excluded: ["P3.outcome=ok", "C10.outcome=ok"]
  title: "Профиль: REALITY принят, но сервер сразу закрыл соединение — UUID или путь"
  why: "Рукопожатие с сервером прошло, но первый запрос через тоннель оборвался: так выглядит UUID, которого нет на сервере, или неверный путь XHTTP."
  actions: ["`sudo xm clients` — есть ли клиент", "Импортировать профиль заново: `sudo xm uri <имя>`"]
  next_checks: [S1]
