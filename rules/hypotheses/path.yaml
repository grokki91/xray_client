# Гипотезы: путь до сервера (L3). Ни одна не поднимается без N1.ok (интернет есть), «подтверждено» —
# только окном сервера (S3) или повтором из другой сети (P5): таймаут ≠ блокировка (§7.3).

- code: path.whitelist
  gate: ["N1.ok=true"]
  confirmed:
    - ["N2.ru_ok=true", "N2.foreign_ok=false", "P1.outcome=timeout", "P5.p1=ok"]
  likely:
    - ["N2.ru_ok=true", "N2.foreign_ok=false", "P1.outcome=timeout"]
  possible:
    - ["N2.ru_ok=true", "N2.foreign_ok=false"]
  excluded: ["N2.foreign_ok=true", "P1.outcome=ok"]
  title: "Белый список: российские сайты открываются, зарубежные и сервер — нет"
  why: "Так выглядит режим белого списка мобильной сети (IP + SNI): пускают только разрешённые адреса."
  alternative: "То же даст фильтр на роутере или корпоративный прокси. Подтвердить — повтором из другой сети (домашний Wi-Fi)."
  actions: ["Конфигом не лечится: рабочего публичного обхода белых списков нет", "Проверить из другой сети (Wi-Fi ↔ мобильная)"]
  next_checks: [P5]

- code: path.ip.unreachable
  gate: ["N1.ok=true"]
  confirmed:
    - ["P1.outcome=timeout", "P5.p1=ok"]
    - ["P1.outcome=timeout", "S3.code=net.nosyn", "C7.syn_seen=true"]
    - ["S3.code=net.synack", "S3.ssh=true"]
  likely:
    - ["P1.outcome=timeout", "P4.tcp=timeout"]
    - ["P1.outcome=timeout", "P2.outcome=tcp_timeout"]
    - ["P1.outcome=timeout", "S0.ssh=unreachable"]
  possible:
    - ["P1.outcome=timeout|unreachable"]
  excluded: ["P1.outcome=ok", "S3.own=true", "N2.foreign_ok=false"]
  title: "Адрес сервера недоступен: TCP до порта сервера не устанавливается"
  why: "Интернет есть (эталонные сайты открываются), а соединение с сервером не устанавливается ни с первой попытки, ни с повтора."
  alternative: "Это похоже на блокировку адреса по пути, но то же даёт бан IP хостера, белый список мобильной сети или файрвол роутера. Различить — повтором из другой сети."
  actions:
    - "Проверить из другой сети (Wi-Fi ↔ мобильный интернет): там работает — режет сеть, не сервер"
    - "Конфигом не лечится: бан адреса/ASN — запасной сервер у другого хостера"
    - "Перед повтором подождать 2 минуты: частые попытки сами похожи на шторм"
  next_checks: [P5, S3]

- code: path.hello
  gate: ["N1.ok=true"]
  confirmed:
    - ["P2.outcome=hello_timeout|reset_after_hello|eof_after_hello", "S3.stage=tcp|partial", "S3.ssh=true"]
    - ["P2.outcome=hello_timeout|reset_after_hello|eof_after_hello", "P5.p2=mask_cert"]
    - ["S3.code=net.hello", "S3.ssh=true"]
  likely:
    - ["P1.outcome=ok", "P2.outcome=hello_timeout|reset_after_hello|eof_after_hello", "N4.ok=true", "P4.tls=hello_timeout|reset_after_hello|eof_after_hello|tcp_timeout"]
  possible:
    - ["P1.outcome=ok", "P2.outcome=hello_timeout|reset_after_hello|eof_after_hello"]
  excluded: ["P2.outcome=mask_cert", "S3.stage=hello", "P3.outcome=ok"]
  title: "TCP до сервера есть, а ClientHello с SNI маски не проходит"
  why: "Соединение с портом сервера устанавливается, но после ClientHello ответа нет или приходит обрыв — а тот же сайт-маска по своему настоящему адресу открывается. Так режут первый пакет с SNI на адрес сервера."
  alternative: "То же даёт сервер, у которого nginx принимает соединение, а Xray за ним не отвечает (самопроверка сервера), и большой ClientHello при малом MTU."
  actions: ["Проверить из другой сети", "Сменить маску: `sudo xm sni-scan`", "На сервере: `sudo xm doctor` — стадия попытки"]
  next_checks: [S3, P5]

- code: path.freeze.post
  gate: ["N1.ok=true"]
  confirmed:
    - ["P3.freeze=post", "S3.after=post", "S3.ssh=true"]
    - ["P3.freeze=post", "P5.p3=ok"]
    - ["S3.code=net.freeze", "S3.after=post", "S3.ssh=true"]
  likely:
    - ["P3.outcome=freeze", "P3.freeze=post"]
    - ["P3.outcome=handshake_timeout", "P2.outcome=mask_cert"]
  excluded: ["P3.outcome=ok", "S3.after=flow"]
  title: "Заморозка: сразу после рукопожатия ответ сервера до ПК не доходит"
  why: "Рукопожатие эталонного ядра началось, но данные от сервера встали в самом начале (до 1 КБ). Так выглядит заморозка ТСПУ по отпечатку или SNI."
  alternative: "То же даёт перегруженный сервер или сеть с большими потерями; подтвердить — окном сервера или из другой сети."
  actions: ["В клиенте fp=firefox (ядро Xray от v26.3.27); во время заморозки fp не менять", "Проверить из другой сети", "Сменить маску: `sudo xm sni-scan`"]
  next_checks: [S3, P5]

- code: path.freeze.mid
  gate: ["N1.ok=true"]
  confirmed:
    - ["P3.freeze=mid", "S3.after=mid", "S3.ssh=true"]
    - ["P3.freeze=mid", "P5.p3=ok"]
  likely:
    - ["P3.outcome=freeze", "P3.freeze=mid"]
  excluded: ["P3.outcome=ok", "S3.after=flow"]
  title: "Заморозка: данные от сервера встают на 1–10 КБ"
  why: "Тоннель эталонного ядра поднялся, но загрузка встала на первых килобайтах."
  alternative: "Перегрузка сервера или потери в сети дают похожую картину; подтвердить — окном сервера или из другой сети."
  actions: ["Проверить из другой сети", "fp=firefox (ядро от v26.3.27)", "Сменить маску: `sudo xm sni-scan`"]
  next_checks: [S3, P5]

- code: path.freeze.f16
  gate: ["N1.ok=true"]
  confirmed:
    - ["P3.freeze=f16", "S3.after=f16", "S3.ssh=true"]
    - ["P3.freeze=f16", "P5.p3=ok"]
    - ["S3.code=net.f16", "S3.ssh=true"]
  likely:
    - ["P3.outcome=freeze", "P3.freeze=f16"]
  excluded: ["P3.outcome=ok", "S3.after=flow"]
  title: "Заморозка TCP на 10–32 КБ к адресу хостинга"
  why: "Данные через тоннель встали на 10–32 КБ: это известная с 2025 года заморозка соединений к адресам хостинговых ASN, протокол не важен."
  alternative: "Встречается и при проблемах на стороне хостера; подтвердить — окном сервера или из другой сети."
  actions: ["Конфигом не лечится: другой хостер/ASN или мост", "Проверить из другой сети"]
  next_checks: [S3, P5]

- code: path.freeze.fp
  possible:
    - ["C7.tls_hellos>=4"]
  title: "Много TLS-соединений к серверу за минуту — риск «заморозки по отпечатку»"
  why: "Захват показал больше трёх TLS-хендшейков клиента к серверу за минуту. По отчётам (2026-05…06) это приводит к заморозке на 2–10 минут."
  actions: ["Не жать «Подключить» многократно; подождать 2–3 минуты", "XHTTP с xmux по умолчанию держит до трёх соединений — не трогать без замера"]
