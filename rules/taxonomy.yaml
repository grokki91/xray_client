  path.ip.unreachable:   {layer: L3, order: 500, title: "Адрес сервера недоступен по пути"}
  path.port:             {layer: L3, order: 505, title: "Порт сервера режется по пути"}
  path.hello:            {layer: L3, order: 510, title: "ClientHello режется по пути"}
  path.freeze.post:      {layer: L3, order: 520, title: "Заморозка после рукопожатия"}
  path.freeze.mid:       {layer: L3, order: 525, title: "Заморозка на 1–10 КБ"}
