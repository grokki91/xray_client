  client.socks.exposed:  {layer: L0, order: 950, title: "Локальный прокси открыт в сеть"}
  client.core.bug6797:   {layer: L0, order: 951, title: "Ядро с открытой ошибкой #6797"}
  server.version:        {layer: L4, order: 952, title: "Правило X25519MLKEM768 на сервере"}
  lan.dns.spoof:         {layer: L2, order: 953, title: "Провайдер подменяет DNS"}
  lan.ipv6.leak:         {layer: L2, order: 954, title: "IPv6 мимо тоннеля"}
  beyond.ru_direct:      {layer: L6, order: 955, title: "Российские сайты через тоннель закрыты"}
  path.sni:              {layer: L3, order: 956, title: "SNI маски режется в этой сети"}
  # Итоги без причины.
  unknown.budget:        {layer: "-", order: 989, title: "Сервер не проверен: лимит проб"}
  unknown.need_window:   {layer: "-", order: 990, title: "Без окна сервера причину не назвать"}
  unknown.need_other_network: {layer: "-", order: 991, title: "Нужна проверка из другой сети"}
  unknown:               {layer: "-", order: 999, title: "Причина не определена"}

# Проверки: что предлагать в «Если не помогло» (next_checks).
checks:
  C6: "Логи клиента: вставить экспорт логов Hiddify («Логи» → «Скопировать») или включить запись логов в v2rayN"
  C7: "Захват ClientHello клиента (pktmon, нужен UAC): кнопка «Углублённо» — показывает, что именно шлёт клиент"
  P5: "Повтор из другой сети: переключиться Wi-Fi ↔ мобильный интернет (раздача с телефона) и нажать «Повторить из другой сети»"
  S1: "Факты сервера через мост: настроить SSH-алиас и на сервере один раз выполнить `sudo xm bridge on`"
  S3: "Окно сервера: `sudo xm doctor --live 60 --json` на сервере, в это время один раз «Подключить» в клиенте; файл — «Импорт doctor.json»"
  W5: "Временно выключить сетевой экран/веб-защиту антивируса и повторить диагностику"
  B3: "Проверить сайт в браузере через VPN, а не индикатор «задержка» в клиенте"
