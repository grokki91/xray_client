# Таксономия причин и каталог проверок (docs/architecture.md §1.5, §6, §7.1).
# Порядок причин — стек: сначала то, без чего остальное не важно (интернет, профиль),
# затем клиент → профиль → ОС → путь → сервер → за тоннелем. Вердикт — первая причина
# с уровнем «вероятно» или выше.

layers:
  L0: Клиентское приложение
  L1: Windows
  L2: Локальная сеть
  L3: Путь до сервера
  L4: Сервер
  L5: Профиль
  L6: За тоннелем
  "-": Итог

codes:
  lan.noinet:            {layer: L2, order: 100, title: "Нет интернета"}
  profile.missing:       {layer: L5, order: 110, title: "Профиль не найден"}
  server.listen:         {layer: L4, order: 150, title: "Сервер: Xray не слушает порт"}
  server.dns:            {layer: L4, order: 151, title: "Сервер: маска не резолвится"}
  server.egress:         {layer: L4, order: 152, title: "Сервер: нет выхода в интернет"}
  server.handshake:      {layer: L4, order: 153, title: "Сервер: своё рукопожатие не проходит"}
  server.firewall:       {layer: L4, order: 154, title: "Сервер: порт закрыт в UFW"}
  server.syn:            {layer: L4, order: 155, title: "Сервер: SYN доходит, ответа нет"}
  server.port.drop:      {layer: L4, order: 156, title: "Сервер: порт молчит, SSH отвечает"}
  client.service.down:   {layer: L0, order: 200, title: "Клиент: ядро или служба не запустились"}
  client.tun.failed:     {layer: L0, order: 210, title: "Клиент: TUN не поднялся"}
  client.config.convert: {layer: L0, order: 220, title: "Клиент: профиль сконвертирован с ошибкой"}
  client.core.mlkem:     {layer: L0, order: 250, title: "Клиент: ядро без X25519MLKEM768"}
  client.core.old:       {layer: L0, order: 255, title: "Клиент: версия ядра не принимается сервером"}
  profile.fp:            {layer: L5, order: 260, title: "Профиль: отпечаток fp"}
  client.tunnel:         {layer: L0, order: 265, title: "Клиент: трафик через него не идёт"}
  client.clock:          {layer: L0, order: 270, title: "Часы ПК расходятся"}
  os.proxy.dead:         {layer: L1, order: 280, title: "Windows: системный прокси в никуда"}
  os.route.loop:         {layer: L1, order: 285, title: "Windows: маршрут к серверу в TUN"}
  os.firewall.block:     {layer: L1, order: 290, title: "Windows: файрвол блокирует клиент"}
  os.adapter.conflict:   {layer: L1, order: 295, title: "Windows: конфликт VPN-адаптеров"}
  os.av.filter:          {layer: L1, order: 298, title: "Windows: сторонний сетевой фильтр"}
  profile.import:        {layer: L5, order: 300, title: "Профиль испорчен при импорте"}
  profile.uuid:          {layer: L5, order: 305, title: "Профиль: UUID"}
  profile.pbk:           {layer: L5, order: 310, title: "Профиль: публичный ключ (pbk)"}
  profile.sid:           {layer: L5, order: 315, title: "Профиль: shortId"}
  profile.sni:           {layer: L5, order: 320, title: "Профиль: SNI"}
  profile.path:          {layer: L5, order: 325, title: "Профиль: путь XHTTP"}
  profile.port:          {layer: L5, order: 330, title: "Профиль: порт"}
  profile.transport:     {layer: L5, order: 335, title: "Профиль: транспорт"}
  profile.reality:       {layer: L5, order: 340, title: "Профиль не принят REALITY"}
  profile.user:          {layer: L5, order: 345, title: "Профиль: UUID или путь"}
