  ok.client:             {layer: "-", order: 897, title: "Всё работает: клиент подключён"}
  ok.idle:               {layer: "-", order: 898, title: "Сервер в порядке, клиент не подключён"}
  ok:                    {layer: "-", order: 900, title: "Сервер и профиль в порядке"}
